<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haar-Typ-Test</title>
<style>
/* Layout: schmale Spalte, Glas-Karten, schwebende Produktbilder, Marquee mit Produktfotos. Palette: Marine, Violett, Lavendel, Roségold */
:root{
  --navy:#1B2250;
  --violet:#6B4FA3;
  --lav:#DCD3F0;
  --mist:#F5F2FB;
  --rose:#E7A98F;
  --ink:#1E1B2E;
  --muted:#65627D;
  --line:rgba(27,34,80,.12);
  --glass:rgba(255,255,255,.78);
  --font:Arial, Helvetica, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(170deg,#F7F4FD 0%,#EEE8F8 55%,#FBEFEA 100%) fixed;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;pointer-events:none}
.b1{width:340px;height:340px;background:#CDBFEA;top:-100px;right:-120px;animation:drift 24s ease-in-out infinite}
.b2{width:300px;height:300px;background:#F6CDBA;top:42%;left:-130px;animation:drift 28s ease-in-out -9s infinite reverse}
.b3{width:320px;height:320px;background:#B9C4F0;bottom:-120px;right:5%;opacity:.4;animation:drift 32s ease-in-out -15s infinite}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:24px 20px 56px}
.brand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--violet);margin:0 0 20px;font-weight:700}
h1,h2,h3{margin:0;color:var(--navy);text-wrap:balance;line-height:1.16;font-family:var(--font)}
h1{font-size:36px;font-weight:700;letter-spacing:-.015em}
h2{font-size:25px;font-weight:700}
h3{font-size:19px;font-weight:700}
.grad{background:linear-gradient(100deg,var(--navy),var(--violet) 60%,#D4806A);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0}
.lead{margin-top:14px}
.small{font-size:14px;color:var(--muted);line-height:1.5}
.stack{display:flex;flex-direction:column;gap:12px}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:24px;box-shadow:0 12px 36px rgba(27,34,80,.09);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flip{0%,55%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,34px) scale(1.12)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes shimmer{from{background-position:-220% 0}to{background-position:220% 0}}
@keyframes pulse{0%,100%{box-shadow:0 8px 22px rgba(107,79,163,.3)}50%{box-shadow:0 8px 36px rgba(107,79,163,.55)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(90deg)}}
.rise{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}

.btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:var(--font);font-size:17px;font-weight:700;padding:17px 20px;border-radius:999px;border:0;color:#fff;cursor:pointer;background:linear-gradient(100deg,var(--navy),var(--violet) 50%,var(--navy));background-size:220% 100%;animation:pulse 3.2s ease-in-out infinite;transition:transform .18s}
.btn:hover{transform:translateY(-2px);animation:pulse 3.2s ease-in-out infinite,shimmer 1.4s linear infinite}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(255,255,255,.75);color:var(--navy);border:2px solid var(--navy);animation:none}
.btn.ghost:hover{background:#fff;animation:none}
.btn.wa{background:linear-gradient(100deg,#1E7B5B,#2BA27A);animation:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
#focus:focus,#focus:focus-visible{outline:none}

/* Start */
.hero{position:relative;margin:4px 0 22px;border-radius:28px;overflow:hidden;box-shadow:0 18px 44px rgba(27,34,80,.25);aspect-ratio:4/4.6;background:var(--lav)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero .tag{position:absolute;left:14px;bottom:14px;right:14px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--navy);font-weight:700;font-size:15px}
.hero .tag span{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.strip{overflow:hidden;margin:26px -20px 6px;padding:6px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.strip .track{display:flex;gap:14px;width:max-content;animation:marquee 38s linear infinite}
.strip img{height:150px;width:auto;border-radius:16px;box-shadow:0 8px 20px rgba(27,34,80,.15);background:#fff;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips span{font-size:13px;color:var(--navy);background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:99px;padding:6px 12px}

/* Fragen */
.progress{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}
.progress span{font-size:14px;color:var(--muted)}
.bar{height:8px;background:rgba(255,255,255,.85);border-radius:99px;overflow:hidden;margin-bottom:24px;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),#D4806A,var(--violet));background-size:220% 100%;animation:shimmer 3s linear infinite;transition:width .4s}
.back{background:none;border:0;font-family:var(--font);font-size:14px;color:var(--violet);cursor:pointer;padding:6px 0;text-decoration:underline}
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.qhead h2{flex:1}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:var(--font);font-size:17px;line-height:1.4;color:var(--ink);background:var(--glass);border:2px solid rgba(255,255,255,.95);border-radius:18px;padding:15px 16px;cursor:pointer;box-shadow:0 6px 18px rgba(27,34,80,.07);transition:transform .18s,border-color .18s,background .18s;animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.opt::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--lav);background:#fff;transition:all .18s}
.opt:hover{transform:translateY(-2px);border-color:var(--lav)}
.opt[aria-pressed="true"]{border-color:var(--violet);background:#fff}
.opt[aria-pressed="true"]::before{border-color:var(--violet);background:radial-gradient(circle,var(--violet) 45%,#fff 50%)}
.qimg{display:block;width:100%;height:150px;object-fit:cover;border-radius:20px;margin:0 0 20px;box-shadow:0 10px 26px rgba(27,34,80,.14)}

/* Icons */
.ico{position:relative;display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;flex:none;perspective:200px}
.ico .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--violet);opacity:.6;animation:spin 14s linear infinite}
.ico .core{position:absolute;inset:7px;border-radius:50%;background:linear-gradient(140deg,#fff,var(--lav))}
.ico svg{position:relative;width:26px;height:26px;color:var(--navy);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:flip 7s ease-in-out infinite}

/* Laden */
.loading{text-align:center;padding:40px 20px;margin-top:20px}
.loading .big{position:relative;width:96px;height:96px;margin:0 auto 18px}
.loading .big i{position:absolute;inset:0;border-radius:50%;border:3px dashed var(--violet);animation:spin 6s linear infinite}
.loading .big b{position:absolute;inset:10px;border-radius:50%;border:3px solid var(--lav);border-top-color:var(--violet);animation:spin 1.1s linear infinite}

/* Ergebnis */
.badge{display:inline-block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:rgba(255,255,255,.85);border:1px solid var(--line);padding:6px 12px;border-radius:99px;margin-bottom:14px}
.showcase{position:relative;margin:22px 0 6px;padding:26px 16px 22px;border-radius:28px;background:radial-gradient(circle at 50% 30%,#fff 0%,var(--lav) 100%);box-shadow:0 14px 40px rgba(27,34,80,.14);display:flex;justify-content:center;align-items:flex-end;gap:14px;overflow:hidden}
.showcase img{display:block;max-height:340px;max-width:46%;width:auto;height:auto;object-fit:contain;border-radius:16px;box-shadow:0 16px 30px rgba(27,34,80,.22);background:#fff;animation:floaty 6s ease-in-out infinite}
.showcase img:nth-child(2){animation-delay:-3s}
.showcase img.solo{max-width:70%;max-height:420px}
.sparkle{position:absolute;width:14px;height:14px;color:var(--rose);fill:currentColor;animation:twinkle 4s ease-in-out infinite}
.card{padding:22px 20px}
.why{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.why li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.why svg{width:22px;height:22px;margin-top:1px;fill:none;stroke:var(--violet);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#FFF3EE;border:1px solid #F3CDBD;font-size:14.5px;color:#6A3A2A}
.sec{margin:34px 0 14px}
.mini{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:14px}
.mini img{width:96px;height:120px;object-fit:cover;border-radius:14px}
.contact{margin-top:28px;border-radius:24px;padding:26px 22px;color:#fff;background:linear-gradient(140deg,var(--navy),#3B2F7A 60%,var(--violet));box-shadow:0 14px 36px rgba(27,34,80,.32)}
.contact h3{color:#fff;margin-bottom:10px}
.contact a{color:#fff}
.contact p+p{margin-top:6px}
.contact .btn{margin-top:16px;animation:none}
.partner{margin-top:28px;padding:24px 20px}
.partner .stack{margin-top:16px}
.facts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .strip{overflow-x:auto}
}
</style>
</head>

    '<div class="progress"><span>Frage '+(i+1)+' von '+total+'</span><button class="back" id="back" type="button">Zurück</button></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>' +
    '<div class="qhead rise">'+icon(q.icon)+'<h2 tabindex="-1" id="focus">'+q.q+'</h2></div><div class="stack">';
  q.o.forEach(function(t, k){
    html += '<button class="opt" type="button" data-k="'+k+'" style="--d:'+(0.06+k*0.06).toFixed(2)+'s" aria-pressed="'+(A[i]===k)+'">'+t+'</button>';
  });
  html += '</div>';
  app.innerHTML = html;
  document.getElementById("back").onclick = function(){ if(timer){clearTimeout(timer);} i===0 ? renderStart() : renderQuestion(i-1); };
  var opts = app.querySelectorAll(".opt");
  Array.prototype.forEach.call(opts, function(b){
    b.onclick = function(){
      if(timer){ clearTimeout(timer); }
      A[i] = parseInt(b.getAttribute("data-k"),10); saveState();
      Array.prototype.forEach.call(opts, function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
      timer = setTimeout(function(){
        if(i === 0 && A[0] === 1){ renderLoading(); }
        else if(i+1 < Q.length){ renderQuestion(i+1); }
        else { renderLoading(); }
      }, 300);
    };
  });
  focusTop();
}

function compute(){
  if(A[0] === 1){ return {main:"maenner", extra:null, doctor:true}; }
  var focusKeys = ["haarausfall","kopfhaut","locken","trocken","feuchtigkeit","gloss","volumen"];
  var fine = (A[2] === 0);
  var main = focusKeys[A[1]];
  if(main === "trocken"){ main = fine ? "trocken_duenn" : "trocken_dick"; }
  if(main === "feuchtigkeit"){ main = fine ? "erweitert" : "feuchtigkeit"; }
  var sc = {haarausfall:(A[5]||0), kopfhaut:(A[4]||0), trocken:(A[6]||0), locken:((A[3]||0) >= 2 ? (A[3]||0) : 0)};
  var mainBase = main.indexOf("trocken") === 0 ? "trocken" : main;
  var best = null, bv = 1;
  ["haarausfall","kopfhaut","trocken","locken"].forEach(function(k){
    if(k !== mainBase && sc[k] > bv){ best = k; bv = sc[k]; }
  });
  if(best === "trocken"){ best = fine ? "trocken_duenn" : "trocken_dick"; }
  return {main:main, extra:best, doctor:(A[5] >= 2)};
}

function renderLoading(){
  view = "loading"; saveState();
  if(timer){ clearTimeout(timer); }
  app.innerHTML = brand() + '<div class="glass loading rise"><div class="big"><i></i><b></b></div><h2 tabindex="-1" id="focus">Dein Haar-Profil wird erstellt</h2><p class="small" style="margin-top:8px">Einen Moment, wir stellen dein Set zusammen.</p></div>';
  focusTop();
  timer = setTimeout(showResult, 1800);
}

function resultCard(res, isMain){
  var imgs = "";
  res.imgs.forEach(function(f){ imgs += '<img class="'+(res.imgs.length===1 || res.solo ? "solo":"")+'" src="'+IMG+f+'" alt="'+res.title+'">'; });
  var html = '';
  if(isMain){
    html += '<div class="showcase rise" style="--d:.2s">'+sparkle("top:16px;left:18px")+sparkle("top:30px;right:22px;animation-delay:-1.5s;width:10px;height:10px")+sparkle("bottom:20px;left:30px;animation-delay:-2.5s;width:9px;height:9px")+imgs+'</div>';
  }
  return html;
}

function showResult(){
  view = "result"; saveState();
  var c = compute(), res = R[c.main];
  var html = brand();
  html += '<span class="badge rise">Dein Ergebnis</span>' +
    '<h1 class="grad rise" style="--d:.08s" tabindex="-1" id="focus">'+res.title+'</h1>' +
    '<p class="lead rise" style="--d:.14s">'+res.text+'</p>' +
    resultCard(res, true) +
    '<div class="glass card rise" style="margin-top:18px;--d:.3s"><h3>Das ist in deinem Set gedacht</h3><ul class="why">';
  res.lines.forEach(function(l){ html += '<li>'+chk()+'<span>'+l+'</span></li>'; });
  html += '</ul>';
  if(c.doctor || res.doctor){ html += '<p class="note">Bei starkem, plötzlichem oder anhaltendem Haarausfall lass die Ursache bitte zusätzlich ärztlich abklären.</p>'; }
  if(res.skin){ html += '<p class="note">Bei starkem Juckreiz, Rötungen oder Schuppen, die nicht besser werden, hole bitte zusätzlich ärztlichen Rat.</p>'; }
  html += '<p class="small" style="margin-top:14px">Die genaue Zusammenstellung deines Sets besprichst du persönlich mit '+PARTNER+'.</p>' +
    ext(LINKS[res.key] || SHOP_LINK, LINKS[res.key] ? "Mein Set ansehen und bestellen" : "Zu Ursulas Shop", "btn") .replace('class="btn"','class="btn" style="margin-top:18px"') + '</div>';

  if(c.extra && R[c.extra]){
    var ex = R[c.extra];
    html += '<h2 class="sec grad rise">Auch interessant für dich</h2>' +
      '<div class="glass mini rise"><img src="'+IMG+ex.imgs[0]+'" alt="'+NAMES[c.extra]+'"><div><h3>'+NAMES[c.extra]+'</h3><p class="small" style="margin:6px 0 10px">Deine Antworten zeigen, dass dieser Bereich dich ebenfalls beschäftigt.</p>'+ext(LINKS[ex.key] || SHOP_LINK, LINKS[ex.key] ? "Zum Set" : "Zum Shop", "btn").replace('class="btn"','class="btn" style="padding:12px 16px;font-size:15px;animation:none"')+'</div></div>';
  }

  html += '<div class="contact rise"><h3>Persönlich für dich da</h3>' +
    '<p>Du hast Fragen oder möchtest dein Set persönlich zusammenstellen? Ich berate dich gern.</p>' +
    '<p style="margin-top:12px"><b>'+PARTNER+'</b><br>MONAT Market Partner · '+STUDIO+'</p>' +
    '<p>Telefon: <a href="tel:'+PHONE_TEL+'">'+PHONE_SHOW+'</a><br>E-Mail: <a href="mailto:'+EMAIL+'">'+EMAIL+'</a></p>' +
    ext(WHATSAPP, "Per WhatsApp schreiben", "btn wa") + ext(SHOP_LINK, "Zu meinem MONAT Shop", "btn ghost").replace('class="btn ghost"','class="btn ghost" style="margin-top:10px"') + '</div>';

  if(LINKS.partner && LINKS.klein){ html += '<div class="glass partner rise"><h3>Du möchtest mehr als Kundin sein?</h3>' +
    '<p style="margin-top:8px">Werde Teil des Teams und verdiene mit etwas, das du liebst.</p>' +
    '<div class="stack">'+ext(LINKS.partner, "Market Partner werden", "btn")+ext(LINKS.klein, "Kleines Paket ansehen", "btn ghost")+'</div></div>'; }

  html += '<div class="stack" style="margin-top:24px"><button class="btn ghost" id="again" type="button">Test noch einmal machen</button></div>' +
    '<p class="small" style="margin-top:20px">Dieser Test ist eine Selbsteinschätzung und dient der allgemeinen Information. Er ersetzt keine ärztliche Diagnose oder Behandlung.</p>';

  app.innerHTML = html;
  document.getElementById("again").onclick = renderStart;
  focusTop();
}

function focusTop(){
  window.scrollTo(0,0);
  var f = document.getElementById("focus");
  if(f){ try{ f.focus({preventScroll:true}); }catch(e){} }
}

document.addEventListener("click", function(e){
  var a = e.target.closest ? e.target.closest("a[href]") : null;
  if(a && view === "result"){ saveState(window.pageYOffset || document.documentElement.scrollTop || 0); }
});

(function init(){
  var st = null;
  try{ st = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  if(st && st.a && st.v){
    A = st.a;
    var done = (A[0] === 1) || (A.length >= Q.length);
    if((st.v === "result" || st.v === "loading") && done){
      showResult();
      if(st.s){ window.scrollTo(0, st.s); }
      return;
    }
    var m = /^q(\d+)$/.exec(st.v);
    if(m){ renderQuestion(Math.min(parseInt(m[1],10), Q.length-1)); return; }
  }
  renderStart();
})();
</script>
</body>
</html>
