function renderQuestion(i){
  view = "q" + i; saveState();
  var q = Q[i], total = Q.length, pct = Math.round(((i+1)/total)*100);
  var html = head("Welcher Haar-Typ bist du?", "") .replace('<h1 id="focus" tabindex="-1">','<h1>').replace('<p class="sub"></p>','') +

    '<div class="progress-row"><span class="progress-label">Frage '+(i+1)+' von '+total+'</span><button class="back" id="back" type="button">Zurück</button></div></div>' +
    '<div class="body"><div class="screen">' +
    (q.img ? '<img class="qimg" src="'+IMG+q.img+'" alt="">' : '') +
    '<div class="question" id="focus" tabindex="-1">'+q.q+'</div><div class="options">';

  document.getElementById("back").onclick = function(){ if(timer){clearTimeout(timer);} i===0 ? renderStart() : renderQuestion(i-1); };
  var opts = app.querySelectorAll(".option");
  Array.prototype.forEach.call(opts, function(b){
    b.onclick = function(){
      if(timer){ clearTimeout(timer); }
      A[i] = parseInt(b.getAttribute("data-k"),10); saveState();
      Array.prototype.forEach.call(opts, function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
      timer = setTimeout(function(){
        if(i === 0 && A[0] === 1){ renderLoading(); }
        else if(i+1 < Q.length){ renderQuestion(i+1); }
        else { renderLoading(); }
      }, 300);
    };
  });
  focusTop();
}

function compute(){
  if(A[0] === 1){ return {main:"maenner", extra:null, doctor:true}; }
  var focusKeys = ["haarausfall","kopfhaut","locken","trocken","feuchtigkeit","gloss","volumen"];
  var fine = (A[2] === 0);
  var main = focusKeys[A[1]];
  if(main === "trocken"){ main = fine ? "trocken_duenn" : "feuchtigkeit"; }
  if(main === "feuchtigkeit"){ main = fine ? "erweitert" : "feuchtigkeit"; }
  var sc = {haarausfall:(A[5]||0), kopfhaut:(A[4]||0), trocken:(A[6]||0), locken:((A[3]||0) >= 2 ? (A[3]||0) : 0)};
  var mainBase = main.indexOf("trocken") === 0 ? "trocken" : main;
  var best = null, bv = 1;
  ["haarausfall","kopfhaut","trocken","locken"].forEach(function(k){
    if(k !== mainBase && sc[k] > bv){ best = k; bv = sc[k]; }
  });
  if(best === "trocken"){ best = fine ? "trocken_duenn" : "feuchtigkeit"; }
  return {main:main, extra:best, doctor:(A[5] >= 2)};
}

/* ====== Musik ====== */
var bgm = document.getElementById("bgm"), mbtn = document.getElementById("music");
var MUSIK_KEY = "haartest_benz_musik";
var fadeT = null;
function fadeTo(v, ms){
  if(fadeT){ clearInterval(fadeT); }
  var start = bgm.volume, steps = 20, n = 0;
  fadeT = setInterval(function(){
    n++; bgm.volume = Math.max(0, Math.min(1, start + (v-start)*(n/steps)));
    if(n >= steps){ clearInterval(fadeT); fadeT = null; if(v === 0){ bgm.pause(); } }
  }, ms/steps);
}
function musicSync(){
  var on = !bgm.paused;
  mbtn.classList.toggle("on", on);
  mbtn.classList.toggle("hint", !on && !musicChosen());
  mbtn.setAttribute("aria-pressed", on ? "true" : "false");
  mbtn.setAttribute("aria-label", on ? "Musik ausschalten" : "Musik einschalten");
}
function musicChosen(){ try{ return !!localStorage.getItem(MUSIK_KEY); }catch(e){ return false; } }
function musicPlay(){
  bgm.volume = 0;
  var pr = bgm.play();
  if(pr && pr.then){ pr.then(function(){ fadeTo(0.35, 1800); musicSync(); }, function(){ musicSync(); }); }
  else { fadeTo(0.35, 1800); }
  try{ localStorage.setItem(MUSIK_KEY, "an"); }catch(e){}
}
function musicStop(){
  fadeTo(0, 600);
  try{ localStorage.setItem(MUSIK_KEY, "aus"); }catch(e){}
  setTimeout(musicSync, 700);
}
mbtn.onclick = function(){ if(bgm.paused){ musicPlay(); } else { musicStop(); } };
bgm.addEventListener("play", musicSync); bgm.addEventListener("pause", musicSync);
document.addEventListener("visibilitychange", function(){ if(document.hidden && !bgm.paused){ bgm.pause(); } else if(!document.hidden){ try{ if(localStorage.getItem(MUSIK_KEY) === "an" && bgm.paused && started){ bgm.play().catch(function(){}); } }catch(e){} } });
var started = false;
function musicAutostart(){
  started = true;
  var pref = null; try{ pref = localStorage.getItem(MUSIK_KEY); }catch(e){}
  if(pref !== "aus" && bgm.paused){ musicPlay(); }
}


function focusTop(){
  window.scrollTo(0,0);
  var f = document.getElementById("focus");
  if(f){ try{ f.focus({preventScroll:true}); }catch(e){} }
}
document.addEventListener("click", function(e){
  var a = e.target.closest ? e.target.closest("a[href]") : null;
  if(a && view === "result"){ saveState(window.pageYOffset || document.documentElement.scrollTop || 0); }
});
(function init(){
  var st = null;
  try{ st = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  if(st && st.a && st.v){
    A = st.a;
    var done = (A[0] === 1) || (A.length >= Q.length);
    if((st.v === "result" || st.v === "loading") && done){ showResult(); if(st.s){ window.scrollTo(0, st.s); } return; }
    var m = /^q(\d+)$/.exec(st.v);
    if(m){ renderQuestion(Math.min(parseInt(m[1],10), Q.length-1)); return; }
  }
  renderStart();
})();
</script>
